<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futur One - The Hub - 5 High-Density Proposals</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;700;900&display=swap');

        :root {
            --c-red: #BE123C;
            --c-black: #0E1013;
            --c-gray-100: #F1F5F9;
            --c-gray-200: #E2E8F0;
            --c-gray-400: #94A3B8;
            --c-text-muted: #64748B;
        }

        body {
            margin: 0; padding: 60px 20px;
            background-color: #F8F9FA;
            color: var(--c-black);
            font-family: 'Inter', sans-serif;
            display: flex; flex-direction: column; gap: 80px; align-items: center;
        }

        .proposal-container {
            width: 480px; height: 350px; /* Resseré pour laisser de la place au texte */
            background: white; border: 0.5px solid var(--c-gray-200);
            position: relative; display: flex; align-items: center; justify-content: center;
            overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.03);
        }

        .label-tag {
            position: absolute; top: 15px; left: 15px;
            font-size: 8px; font-weight: 900; letter-spacing: 0.2em;
            text-transform: uppercase; color: var(--c-gray-400); z-index: 20;
        }

        /* --- ELEMENTS COMMUNS --- */
        .core {
            width: 70px; height: 70px; z-index: 15;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
        }
        .core span { font-size: 6px; font-weight: 700; letter-spacing: 0.3em; opacity: 0.6; }
        .core strong { font-size: 10px; font-weight: 900; line-height: 1; }

        .sat { position: absolute; width: 100px; z-index: 10; }
        .sat-t { font-size: 8px; font-weight: 900; letter-spacing: 0.05em; margin-bottom: 2px; }
        .sat-d { font-size: 7px; line-height: 1.25; color: var(--c-text-muted); }

        /* ============================================================
           06. THE ORBITAL COMPACT (Mix 1, 2, 3)
           Lignes fines, dot grid léger, core monolithique mais réduit.
           ============================================================ */
        .p6-dot-grid { position: absolute; inset: 0; background-image: radial-gradient(var(--c-gray-200) 0.5px, transparent 0.5px); background-size: 12px 12px; opacity: 0.3; }
        .p6-core { background: var(--c-black); color: white; border: 3px solid white; outline: 0.5px solid var(--c-black); }
        .p6-orbit { position: absolute; border: 0.5px solid var(--c-gray-200); border-radius: 50%; }
        .p6-line { position: absolute; height: 0.5px; background: linear-gradient(90deg, var(--c-red), transparent); transform-origin: left center; opacity: 0.6; }
        .p6-sat { border-bottom: 1px solid var(--c-gray-100); padding-bottom: 4px; }

        /* ============================================================
           07. THE TECHNICAL STACK (Vertical Alignment)
           Optimisé pour le texte dense : alignement gauche/droite strict.
           ============================================================ */
        .p7-axis { position: absolute; width: 0.5px; height: 80%; background: var(--c-gray-200); }
        .p7-core { background: white; border: 1px solid var(--c-black); border-radius: 0; }
        .p7-sat { width: 140px; display: flex; align-items: flex-start; gap: 8px; }
        .p7-marker { width: 4px; height: 4px; background: var(--c-red); margin-top: 3px; flex-shrink: 0; }

        /* ============================================================
           08. THE SCHEMATIC CROSS (Swiss Precision + Dot)
           Focus sur les angles droits et la clarté.
           ============================================================ */
        .p8-line { position: absolute; background: var(--c-gray-200); }
        .p8-core { background: var(--c-black); color: white; border-radius: 2px; }
        .p8-sat { background: white; padding: 4px 8px; border-left: 1.5px solid var(--c-red); }

        /* ============================================================
           09. THE RADIAL BLUEPRINT (Blueprint focus)
           Cercle pointillé large, core minimaliste.
           ============================================================ */
        .p9-circle { position: absolute; border: 0.5px dashed var(--c-gray-400); border-radius: 50%; opacity: 0.5; }
        .p9-core { border: 1px solid var(--c-black); background: white; }
        .p9-sat { text-align: center; width: 90px; }
        .p9-dot { width: 3px; height: 3px; background: var(--c-black); border-radius: 50%; margin: 0 auto 4px; }

        /* ============================================================
           10. THE MONO-CHROME IMPACT
           Noir, Blanc, et une seule ligne rouge de tension.
           ============================================================ */
        .p10-core { background: var(--c-black); color: white; }
        .p10-red-line { position: absolute; width: 100%; height: 0.5px; background: var(--c-red); z-index: 1; }
        .p10-sat { width: 110px; }
        .p10-sat-t { border-left: 2px solid var(--c-black); padding-left: 6px; }

    </style>
</head>
<body>

    <!-- PROP 06 -->
    <div class="proposal-container" id="p6">
        <div class="p6-dot-grid"></div>
        <div class="label-tag">06. Orbital Compact</div>
        <div class="p6-orbit" style="width: 180px; height: 180px;"></div>
        <div class="core p6-core">
            <span>QATAR</span>
            <strong>FUTUR<br>ONE</strong>
        </div>
    </div>

    <!-- PROP 07 -->
    <div class="proposal-container" id="p7">
        <div class="p7-axis"></div>
        <div class="label-tag">07. Technical Stack</div>
        <div class="core p7-core">
            <strong>FUTUR<br>ONE</strong>
        </div>
    </div>

    <!-- PROP 08 -->
    <div class="proposal-container" id="p8">
        <div class="label-tag">08. Schematic Cross</div>
        <div class="core p8-core">
            <strong>F1</strong>
        </div>
    </div>

    <!-- PROP 09 -->
    <div class="proposal-container" id="p9">
        <div class="label-tag">09. Radial Blueprint</div>
        <div class="p9-circle" style="width: 200px; height: 200px;"></div>
        <div class="core p9-core">
            <strong>FUTUR<br>ONE</strong>
        </div>
    </div>

    <!-- PROP 10 -->
    <div class="proposal-container" id="p10">
        <div class="p10-red-line"></div>
        <div class="label-tag">10. Monochrome Impact</div>
        <div class="core p10-core">
            <strong>F1</strong>
        </div>
    </div>

    <script>
        const nodes = [
            { a: -150, t: 'AI SERVICES', d: 'Models • Data • Tools' },
            { a: -90, t: 'COMPUTE HPC', d: 'H100 Clusters • Tier IV' },
            { a: -30, t: 'ENERGY', d: 'Sustainable Power' },
            { a: 30, t: 'INFRASTRUCTURE', d: 'Campus • Connectivity' },
            { a: 90, t: 'TALENT', d: 'PhD Residency • Experts' },
            { a: 150, t: 'CAPITAL', d: 'Sovereign Fund • Exit' }
        ];

        // RENDER P6
        const p6 = document.getElementById('p6');
        nodes.forEach(n => {
            const rad = n.a * Math.PI / 180;
            const x = Math.cos(rad) * 115; const y = Math.sin(rad) * 115;
            const l = document.createElement('div'); l.className = 'p6-line';
            l.style.width = '70px'; l.style.left = `calc(50% + ${Math.cos(rad) * 35}px)`;
            l.style.top = `calc(50% + ${Math.sin(rad) * 35}px)`; l.style.transform = `rotate(${n.a}deg)`;
            p6.appendChild(l);
            const s = document.createElement('div'); s.className = 'sat p6-sat';
            s.style.left = `calc(50% + ${x}px - 50px)`; s.style.top = `calc(50% + ${y}px - 15px)`;
            s.innerHTML = `<div class="sat-t">${n.t}</div><div class="sat-d">${n.d}</div>`;
            p6.appendChild(s);
        });

        // RENDER P7
        const p7 = document.getElementById('p7');
        nodes.forEach((n, i) => {
            const side = i < 3 ? -1 : 1;
            const y = (i % 3) * 80 - 80;
            const s = document.createElement('div'); s.className = 'sat p7-sat';
            s.style.left = `calc(50% + ${side * 100}px - 70px)`;
            s.style.top = `calc(50% + ${y}px - 20px)`;
            s.style.textAlign = side > 0 ? 'left' : 'right';
            s.style.flexDirection = side > 0 ? 'row' : 'row-reverse';
            s.innerHTML = `<div class="p7-marker"></div><div><div class="sat-t">${n.t}</div><div class="sat-d">${n.d}</div></div>`;
            p7.appendChild(s);
        });

        // RENDER P8
        const p8 = document.getElementById('p8');
        nodes.forEach((n, i) => {
            const rad = n.a * Math.PI / 180;
            const x = Math.cos(rad) * 125; const y = Math.sin(rad) * 110;
            const s = document.createElement('div'); s.className = 'sat p8-sat';
            s.style.left = `calc(50% + ${x}px - 50px)`; s.style.top = `calc(50% + ${y}px - 15px)`;
            s.innerHTML = `<div class="sat-t">${n.t}</div>`;
            p8.appendChild(s);
            // Orthogonal lines
            const lh = document.createElement('div'); lh.className = 'p8-line';
            lh.style.height = '0.5px'; lh.style.width = Math.abs(x)-35 + 'px';
            lh.style.left = x > 0 ? 'calc(50% + 35px)' : `calc(50% + ${x}px + 50px)`;
            lh.style.top = `calc(50% + ${y}px + 10px)`;
            p8.appendChild(lh);
        });

        // RENDER P9
        const p9 = document.getElementById('p9');
        nodes.forEach(n => {
            const rad = n.a * Math.PI / 180;
            const x = Math.cos(rad) * 100; const y = Math.sin(rad) * 100;
            const s = document.createElement('div'); s.className = 'sat p9-sat';
            s.style.left = `calc(50% + ${x}px - 45px)`; s.style.top = `calc(50% + ${y}px - 15px)`;
            s.innerHTML = `<div class="p9-dot"></div><div class="sat-t">${n.t}</div>`;
            p9.appendChild(s);
        });

        // RENDER P10
        const p10 = document.getElementById('p10');
        nodes.forEach((n, i) => {
            const x = (i % 2 === 0 ? -1 : 1) * 140;
            const y = Math.floor(i/2) * 90 - 90;
            const s = document.createElement('div'); s.className = 'sat p10-sat';
            s.style.left = `calc(50% + ${x}px - 55px)`; s.style.top = `calc(50% + ${y}px - 20px)`;
            s.style.textAlign = x > 0 ? 'left' : 'right';
            s.innerHTML = `<div class="sat-t p10-sat-t">${n.t}</div><div class="sat-d">${n.d}</div>`;
            p10.appendChild(s);
        });

    </script>
</body>
</html>
