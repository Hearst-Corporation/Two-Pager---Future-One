<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign AI Hub - Circular Variations</title>
    <style>
        :root {
            --color-bg: #F5F5F6;
            --color-surface: #FFFFFF;
            --color-accent: #9F1239;
            --color-accent-strong: #BE123C;
            --color-text: #0E1013;
            --color-text-muted: #5B616A;
            --color-border: #E4E6EA;
        }

        body {
            margin: 0;
            padding: 60px;
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            gap: 100px;
            align-items: center;
        }

        .header {
            text-align: center;
            max-width: 900px;
        }

        .header h1 {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -2px;
            text-transform: uppercase;
            margin: 0;
            color: var(--color-text);
        }

        .header h1 span { color: var(--color-accent-strong); }

        .header p {
            color: var(--color-text-muted);
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 15px;
            font-weight: 700;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 60px;
            width: 100%;
            max-width: 1200px;
        }

        .card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            padding: 60px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
        }

        .card-meta {
            position: absolute;
            top: 30px;
            left: 30px;
            font-family: monospace;
            font-size: 9px;
            color: var(--color-accent);
            letter-spacing: 2px;
            font-weight: 700;
        }

        .hub-viz {
            position: relative;
            width: 450px;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .core {
            width: 100px;
            height: 100px;
            background: var(--color-accent-strong);
            color: white;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 14px;
            text-align: center;
            z-index: 20;
            box-shadow: 0 0 0 10px var(--color-surface);
        }

        .core span {
            font-size: 7px;
            letter-spacing: 1px;
            opacity: 0.8;
            margin-top: 2px;
        }

        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .sat-label {
            position: absolute;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--color-text);
            text-align: center;
            width: 120px;
        }

        .sat-sub {
            display: block;
            font-size: 7px;
            font-weight: 400;
            color: var(--color-text-muted);
            margin-top: 4px;
            line-height: 1.3;
            letter-spacing: 0;
            text-transform: none;
        }

        /* Ring styles */
        .ring {
            fill: none;
            stroke: var(--color-border);
            stroke-width: 1;
        }

        .ring-accent {
            stroke: var(--color-accent);
            stroke-width: 0.5;
            stroke-dasharray: 2 4;
        }

        .connector {
            stroke: var(--color-accent);
            stroke-width: 1;
            opacity: 0.4;
        }

        .dot {
            fill: var(--color-accent-strong);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Sovereign <span>AI HUB</span></h1>
        <p>10 Circular Editorial Variations — Print Ready</p>
    </div>

    <div class="grid" id="viz-grid"></div>

    <script>
        const grid = document.getElementById('viz-grid');
        const satellites = [
            { title: "COMPUTE & HPC", sub: "Tier IV Data Centers\nHigh-Density Racks" },
            { title: "ENERGY", sub: "Reliable Power\nSustainable Optimization" },
            { title: "INFRASTRUCTURE", sub: "Campus & Facilities\nConnectivity" },
            { title: "TALENT", sub: "Engineers · Researchers\nEntrepreneurs" },
            { title: "CAPITAL", sub: "Sovereign Funds\nLong-Term Alignment" },
            { title: "AI SERVICES", sub: "Models · Data\nTools · Platforms" }
        ];

        function createCard(index) {
            const card = document.createElement('div');
            card.className = 'card';
            
            const meta = document.createElement('div');
            meta.className = 'card-meta';
            const types = ['CONCENTRIC', 'ORBITAL', 'RADIAL', 'FLUID', 'GRIDDED'];
            meta.innerText = `REF: HUB_CIRC_0${index + 1} / TYPE: ${types[index % 5]}`;
            card.appendChild(meta);

            const viz = document.createElement('div');
            viz.className = 'hub-viz';
            
            const core = document.createElement('div');
            core.className = 'core';
            core.innerHTML = "FUTUR<br>ONE<span>QATAR</span>";
            viz.appendChild(core);

            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("viewBox", "0 0 450 450");
            
            // Background Rings
            const ringCount = 3 + (index % 3);
            for(let r=0; r<ringCount; r++) {
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("cx", "225");
                circle.setAttribute("cy", "225");
                circle.setAttribute("r", 60 + (r * 50));
                circle.className = r % 2 === 0 ? "ring" : "ring ring-accent";
                svg.appendChild(circle);
            }

            // Satellites
            satellites.forEach((sat, i) => {
                const angle = (i * 360 / 6) - 90;
                const rad = angle * Math.PI / 180;
                
                // Variation in radius
                let radius = 160;
                if (index % 2 === 0 && i % 2 === 0) radius += 30;
                if (index % 3 === 1) radius = 140 + (i * 10);

                const x = 225 + Math.cos(rad) * radius;
                const y = 225 + Math.sin(rad) * radius;

                // Connector
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", 225 + Math.cos(rad) * 50);
                line.setAttribute("y1", 225 + Math.sin(rad) * 50);
                line.setAttribute("x2", x);
                line.setAttribute("y2", y);
                line.className = "connector";
                if (index % 4 === 0) line.setAttribute("stroke-dasharray", "2 2");
                svg.appendChild(line);

                // Dot
                const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                dot.setAttribute("cx", x);
                dot.setAttribute("cy", y);
                dot.setAttribute("r", index % 3 === 0 ? "4" : "6");
                dot.className = "dot";
                svg.appendChild(dot);

                // Label
                const label = document.createElement('div');
                label.className = 'sat-label';
                label.innerHTML = `${sat.title}<span class="sat-sub">${sat.sub.replace('\n', '<br>')}</span>`;
                
                // Position label based on angle
                const labelDist = radius + 45;
                const lx = 225 + Math.cos(rad) * labelDist;
                const ly = 225 + Math.sin(rad) * labelDist;
                
                label.style.left = `${lx - 60}px`;
                label.style.top = `${ly - 20}px`;
                viz.appendChild(label);
            });

            viz.appendChild(svg);
            card.appendChild(viz);
            return card;
        }

        for (let i = 0; i < 10; i++) {
            grid.appendChild(createCard(i));
        }
    </script>
</body>
</html>
