<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futur One - P2 Section 2 - Hub Icon Fix</title>
    <style>
        :root {
            --color-black: #0E1013;
            --color-white: #FFFFFF;
        }

        body {
            margin: 0;
            padding: 100px;
            background-color: #F5F5F6;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 
           LA DEMANDE EXACTE :
           - Carré plein noir
           - Le "H" en pointillé (contour)
           - Le "H" a le BLANC dedans (plein blanc)
        */

        .hub-square-black {
            width: 120px;
            height: 120px;
            background-color: var(--color-black);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .h-logo-container {
            width: 60px;
            height: 60px;
            position: relative;
            background-color: var(--color-white); /* LE BLANC DEDANS */
            
            /* LE H EN POINTILLÉ (CONTOUR) */
            /* On utilise outline pour le pointillé extérieur */
            outline: 1.5px dashed var(--color-white);
            outline-offset: 4px;

            /* Construction de la forme du H par masquage (clip-path) */
            /* Un H est un rectangle avec deux encoches (haut et bas) */
            clip-path: polygon(
                0% 0%, 35% 0%, 35% 40%, 65% 40%, 65% 0%, 100% 0%, 
                100% 100%, 65% 100%, 65% 60%, 35% 60%, 35% 100%, 0% 100%
            );
        }

        .label {
            margin-top: 24px;
            font-family: "Inter", sans-serif;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--color-black);
            text-align: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="hub-square-black">
            <div class="h-logo-container"></div>
        </div>
        <div class="label">FIX: BLACK SQUARE + WHITE H + DASHED OUTLINE</div>
    </div>

</body>
</html>
