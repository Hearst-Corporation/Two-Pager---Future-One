<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign AI Hub - Circuit Proposals</title>
    <style>
        :root {
            --color-bg: #0E1013;
            --color-surface: #14171B;
            --color-accent: #BE123C;
            --color-accent-dim: rgba(190, 18, 60, 0.2);
            --color-text: #FFFFFF;
            --color-text-muted: #8A9099;
            --color-circuit: #2A2F36;
        }

        body {
            margin: 0;
            padding: 40px;
            background-color: var(--color-bg);
            color: var(--color-text);
            font-family: "Inter", "Helvetica Neue", sans-serif;
            display: flex;
            flex-direction: column;
            gap: 80px;
            align-items: center;
        }

        .header {
            text-align: center;
            max-width: 800px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
            margin: 0;
        }

        .header p {
            color: var(--color-text-muted);
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .proposal-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
            width: 100%;
            max-width: 1200px;
        }

        .proposal-card {
            background: var(--color-surface);
            border: 1px solid var(--color-circuit);
            padding: 40px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 500px;
        }

        .proposal-meta {
            position: absolute;
            top: 20px;
            left: 20px;
            font-family: monospace;
            font-size: 10px;
            color: var(--color-accent);
            letter-spacing: 1px;
        }

        .canvas-container {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hub-core {
            width: 60px;
            height: 60px;
            background: var(--color-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 10px;
            text-align: center;
            z-index: 10;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }

        /* SVG Circuit Styles */
        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .circuit-line {
            fill: none;
            stroke: var(--color-circuit);
            stroke-width: 1;
        }

        .circuit-line.active {
            stroke: var(--color-accent);
            stroke-width: 1.5;
            stroke-dasharray: 4 4;
        }

        .circuit-node {
            fill: var(--color-bg);
            stroke: var(--color-circuit);
            stroke-width: 1.5;
        }

        .circuit-node.active {
            fill: var(--color-accent);
            stroke: var(--color-accent);
        }

        .label {
            position: absolute;
            font-size: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--color-text-muted);
            white-space: nowrap;
            background: var(--color-surface);
            padding: 2px 4px;
        }

        .label.active {
            color: var(--color-text);
            border-left: 2px solid var(--color-accent);
        }

    </style>
</head>
<body>

    <div class="header">
        <h1>Sovereign AI Hub</h1>
        <p>Circuit Topology Proposals — 10 Variations</p>
    </div>

    <div class="proposal-grid" id="main-grid">
        <!-- Proposals will be injected here -->
    </div>

    <script>
        const grid = document.getElementById('main-grid');
        const satellites = [
            "COMPUTE", "ENERGY", "INFRA", "TALENT", "CAPITAL", "AI SERVICES"
        ];

        function createProposal(index) {
            const card = document.createElement('div');
            card.className = 'proposal-card';
            
            const meta = document.createElement('div');
            meta.className = 'proposal-meta';
            meta.innerText = `VARIANT_0${index + 1} / TOPOLOGY_${index % 3 === 0 ? 'RADIAL' : index % 3 === 1 ? 'GRID' : 'HEX'}`;
            card.appendChild(meta);

            const container = document.createElement('div');
            container.className = 'canvas-container';
            
            const core = document.createElement('div');
            core.className = 'hub-core';
            core.innerHTML = "FUTUR<br>ONE";
            container.appendChild(core);

            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("viewBox", "0 0 400 400");
            container.appendChild(svg);

            // Generate unique circuit patterns based on index
            generateCircuit(svg, container, index);

            card.appendChild(container);
            return card;
        }

        function generateCircuit(svg, container, index) {
            const centerX = 200;
            const centerY = 200;
            const count = 6;
            
            for (let i = 0; i < count; i++) {
                const angle = (i * 360 / count) - 90;
                const rad = angle * Math.PI / 180;
                
                // Variation logic
                let radius = 120 + (Math.sin(index + i) * 30);
                let x = centerX + Math.cos(rad) * radius;
                let y = centerY + Math.sin(rad) * radius;

                // Create Path
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.className = i % 2 === 0 ? "circuit-line active" : "circuit-line";
                
                let d = "";
                if (index % 3 === 0) { // Radial Orthogonal
                    const midR = radius * 0.6;
                    const mx = centerX + Math.cos(rad) * midR;
                    const my = centerY + Math.sin(rad) * midR;
                    d = `M ${centerX} ${centerY} L ${mx} ${my} L ${x} ${y}`;
                } else if (index % 3 === 1) { // Angular
                    const offset = 40;
                    d = `M ${centerX} ${centerY} L ${x - offset} ${y} L ${x} ${y}`;
                } else { // Direct with nodes
                    d = `M ${centerX} ${centerY} L ${x} ${y}`;
                }
                
                path.setAttribute("d", d);
                svg.appendChild(path);

                // Add Node
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("cx", x);
                circle.setAttribute("cy", y);
                circle.setAttribute("r", index % 2 === 0 ? "4" : "6");
                circle.className = i % 2 === 0 ? "circuit-node active" : "circuit-node";
                svg.appendChild(circle);

                // Add Label
                const label = document.createElement('div');
                label.className = i % 2 === 0 ? "label active" : "label";
                label.innerText = satellites[i];
                label.style.left = `${x + 10}px`;
                label.style.top = `${y - 5}px`;
                container.appendChild(label);
            }

            // Add some background "noise" circuits
            for (let j = 0; j < 5; j++) {
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", Math.random() * 400);
                line.setAttribute("y1", 0);
                line.setAttribute("x2", Math.random() * 400);
                line.setAttribute("y2", 400);
                line.style.stroke = "var(--color-circuit)";
                line.style.strokeWidth = "0.5";
                line.style.opacity = "0.2";
                svg.appendChild(line);
            }
        }

        for (let i = 0; i < 10; i++) {
            grid.appendChild(createProposal(i));
        }
    </script>
</body>
</html>
