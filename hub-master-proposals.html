<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futur One - The Hub - 5 Master Proposals</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;700;900&display=swap');

        :root {
            --c-red: #BE123C;
            --c-black: #0E1013;
            --c-gray-100: #F1F5F9;
            --c-gray-200: #E2E8F0;
            --c-gray-400: #94A3B8;
        }

        body {
            margin: 0; padding: 80px 40px;
            background-color: #F8F9FA;
            color: var(--c-black);
            font-family: 'Inter', sans-serif;
            display: flex; flex-direction: column; gap: 120px; align-items: center;
        }

        .proposal-container {
            width: 480px; height: 400px;
            background: white; border: 0.5px solid var(--c-gray-200);
            position: relative; display: flex; align-items: center; justify-content: center;
            overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,0.05);
        }

        .label-tag {
            position: absolute; top: 20px; left: 20px;
            font-size: 9px; font-weight: 900; letter-spacing: 0.2em;
            text-transform: uppercase; color: var(--c-gray-400);
        }

        /* --- COMMON ELEMENTS --- */
        .core {
            width: 80px; height: 80px; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
        }
        .core span { font-size: 7px; font-weight: 700; letter-spacing: 0.3em; opacity: 0.6; }
        .core strong { font-size: 11px; font-weight: 900; line-height: 1; }

        .sat { position: absolute; width: 120px; z-index: 5; }
        .sat-t { font-size: 8px; font-weight: 900; letter-spacing: 0.05em; margin-bottom: 4px; }
        .sat-d { font-size: 7px; line-height: 1.3; color: #64748B; }

        /* ============================================================
           PROPOSAL 1: THE MONOLITH (Pure Architectural)
           ============================================================ */
        .p1-core { background: var(--c-black); color: white; border: 4px solid white; outline: 0.5px solid var(--c-black); }
        .p1-line { position: absolute; height: 0.5px; background: var(--c-black); opacity: 0.15; transform-origin: left center; }
        .p1-sat { border-left: 1px solid var(--c-red); padding-left: 10px; }

        /* ============================================================
           PROPOSAL 2: THE BLUEPRINT (Technical Schematic)
           ============================================================ */
        .p2-bg { position: absolute; inset: 0; background-image: radial-gradient(var(--c-gray-200) 0.5px, transparent 0.5px); background-size: 15px 15px; opacity: 0.4; }
        .p2-core { border: 0.5px solid var(--c-black); background: white; }
        .p2-circle { position: absolute; border: 0.5px dashed var(--c-gray-400); border-radius: 50%; }
        .p2-sat { text-align: center; }
        .p2-dot { width: 4px; height: 4px; background: var(--c-red); border-radius: 50%; margin: 0 auto 6px; }

        /* ============================================================
           PROPOSAL 3: THE RADAR (Data-Driven Density)
           ============================================================ */
        .p3-ring { position: absolute; border: 0.5px solid var(--c-gray-200); border-radius: 50%; }
        .p3-core { border-radius: 50%; background: var(--c-red); color: white; }
        .p3-line { position: absolute; height: 0.5px; background: linear-gradient(90deg, var(--c-red), transparent); transform-origin: left center; }
        .p3-sat { display: flex; align-items: center; gap: 10px; width: 150px; }
        .p3-sat-dot { width: 6px; height: 6px; border: 1px solid var(--c-red); flex-shrink: 0; }

        /* ============================================================
           PROPOSAL 4: THE CROSS (Swiss Precision)
           ============================================================ */
        .p4-axis { position: absolute; background: var(--c-gray-200); }
        .p4-core { background: white; border: 1px solid var(--c-black); font-style: italic; }
        .p4-sat { padding: 8px; background: white; border: 0.5px solid var(--c-gray-100); }
        .p4-sat-t { color: var(--c-red); border-bottom: 0.5px solid var(--c-red); display: inline-block; }

        /* ============================================================
           PROPOSAL 5: THE VOID (Minimalist Negative Space)
           ============================================================ */
        .p5-core { background: transparent; border: 1px solid var(--c-black); }
        .p5-core strong { color: var(--c-black); }
        .p5-line { position: absolute; height: 40px; width: 0.5px; background: var(--c-red); }
        .p5-sat { width: 100px; }
        .p5-sat-t { font-weight: 300; font-size: 10px; letter-spacing: 0.1em; }

    </style>
</head>
<body>

    <!-- PROP 1 -->
    <div class="proposal-container" id="p1">
        <div class="label-tag">01. The Monolith</div>
        <div class="core p1-core">
            <span>QATAR</span>
            <strong>FUTUR<br>ONE</strong>
        </div>
    </div>

    <!-- PROP 2 -->
    <div class="proposal-container" id="p2">
        <div class="p2-bg"></div>
        <div class="label-tag">02. The Blueprint</div>
        <div class="p2-circle" style="width: 240px; height: 240px;"></div>
        <div class="core p2-core">
            <strong>FUTUR<br>ONE</strong>
        </div>
    </div>

    <!-- PROP 3 -->
    <div class="proposal-container" id="p3">
        <div class="label-tag">03. The Radar</div>
        <div class="p3-ring" style="width: 180px; height: 180px;"></div>
        <div class="p3-ring" style="width: 280px; height: 280px;"></div>
        <div class="core p3-core">
            <strong>F1</strong>
        </div>
    </div>

    <!-- PROP 4 -->
    <div class="proposal-container" id="p4">
        <div class="label-tag">04. The Cross</div>
        <div class="p4-axis" style="width: 100%; height: 0.5px;"></div>
        <div class="p4-axis" style="width: 0.5px; height: 100%;"></div>
        <div class="core p4-core">
            <strong>FUTUR<br>ONE</strong>
        </div>
    </div>

    <!-- PROP 5 -->
    <div class="proposal-container" id="p5">
        <div class="label-tag">05. The Void</div>
        <div class="core p5-core">
            <strong>F1</strong>
        </div>
    </div>

    <script>
        const nodes = [
            { a: -150, t: 'AI SERVICES', d: 'Models • Data • Tools' },
            { a: -90, t: 'COMPUTE HPC', d: 'H100 Clusters • Tier IV' },
            { a: -30, t: 'ENERGY', d: 'Sustainable Power' },
            { a: 30, t: 'INFRASTRUCTURE', d: 'Campus • Connectivity' },
            { a: 90, t: 'TALENT', d: 'PhD Residency • Experts' },
            { a: 150, t: 'CAPITAL', d: 'Sovereign Fund • Exit' }
        ];

        // RENDER P1
        const p1 = document.getElementById('p1');
        nodes.forEach(n => {
            const rad = n.a * Math.PI / 180;
            const x = Math.cos(rad) * 130; const y = Math.sin(rad) * 130;
            const l = document.createElement('div'); l.className = 'p1-line';
            l.style.width = '90px'; l.style.left = `calc(50% + ${Math.cos(rad) * 40}px)`;
            l.style.top = `calc(50% + ${Math.sin(rad) * 40}px)`; l.style.transform = `rotate(${n.a}deg)`;
            p1.appendChild(l);
            const s = document.createElement('div'); s.className = 'sat p1-sat';
            s.style.left = `calc(50% + ${x}px - 60px)`; s.style.top = `calc(50% + ${y}px - 20px)`;
            s.innerHTML = `<div class="sat-t">${n.t}</div><div class="sat-d">${n.d}</div>`;
            p1.appendChild(s);
        });

        // RENDER P2
        const p2 = document.getElementById('p2');
        nodes.forEach(n => {
            const rad = n.a * Math.PI / 180;
            const x = Math.cos(rad) * 120; const y = Math.sin(rad) * 120;
            const s = document.createElement('div'); s.className = 'sat p2-sat';
            s.style.left = `calc(50% + ${x}px - 60px)`; s.style.top = `calc(50% + ${y}px - 25px)`;
            s.innerHTML = `<div class="p2-dot"></div><div class="sat-t">${n.t}</div><div class="sat-d">${n.d}</div>`;
            p2.appendChild(s);
        });

        // RENDER P3
        const p3 = document.getElementById('p3');
        nodes.forEach(n => {
            const rad = n.a * Math.PI / 180;
            const x = Math.cos(rad) * 140; const y = Math.sin(rad) * 140;
            const l = document.createElement('div'); l.className = 'p3-line';
            l.style.width = '100px'; l.style.left = `calc(50% + ${Math.cos(rad) * 40}px)`;
            l.style.top = `calc(50% + ${Math.sin(rad) * 40}px)`; l.style.transform = `rotate(${n.a}deg)`;
            p3.appendChild(l);
            const s = document.createElement('div'); s.className = 'sat p3-sat';
            s.style.left = `calc(50% + ${x}px - 75px)`; s.style.top = `calc(50% + ${y}px - 10px)`;
            s.style.flexDirection = x > 0 ? 'row' : 'row-reverse';
            s.innerHTML = `<div class="p3-sat-dot"></div><div><div class="sat-t">${n.t}</div></div>`;
            p3.appendChild(s);
        });

        // RENDER P4
        const p4 = document.getElementById('p4');
        const p4Positions = [
            {x: -140, y: -100}, {x: 0, y: -140}, {x: 140, y: -100},
            {x: 140, y: 100}, {x: 0, y: 140}, {x: -140, y: 100}
        ];
        nodes.forEach((n, i) => {
            const s = document.createElement('div'); s.className = 'sat p4-sat';
            s.style.left = `calc(50% + ${p4Positions[i].x}px - 60px)`;
            s.style.top = `calc(50% + ${p4Positions[i].y}px - 25px)`;
            s.innerHTML = `<div class="sat-t p4-sat-t">${n.t}</div><div class="sat-d">${n.d}</div>`;
            p4.appendChild(s);
        });

        // RENDER P5
        const p5 = document.getElementById('p5');
        nodes.forEach(n => {
            const rad = n.a * Math.PI / 180;
            const x = Math.cos(rad) * 130; const y = Math.sin(rad) * 130;
            const l = document.createElement('div'); l.className = 'p5-line';
            l.style.left = `calc(50% + ${Math.cos(rad) * 80}px)`;
            l.style.top = `calc(50% + ${Math.sin(rad) * 80}px)`;
            l.style.transform = `translate(-50%, -50%) rotate(${n.a + 90}deg)`;
            p5.appendChild(l);
            const s = document.createElement('div'); s.className = 'sat p5-sat';
            s.style.left = `calc(50% + ${x}px - 50px)`; s.style.top = `calc(50% + ${y}px - 15px)`;
            s.style.textAlign = 'center';
            s.innerHTML = `<div class="sat-t p5-sat-t">${n.t}</div>`;
            p5.appendChild(s);
        });
    </script>
</body>
</html>
