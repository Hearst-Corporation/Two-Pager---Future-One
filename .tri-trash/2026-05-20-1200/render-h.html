<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; }
  body { background: #000; width: 1280px; height: 720px; display: flex; align-items: center; justify-content: center; }
  .container {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 1280px;
    height: 720px;
    background: radial-gradient(ellipse at center, #1a0010 0%, #000 70%);
  }
  svg {
    width: 420px;
    height: 420px;
    filter: drop-shadow(0 0 60px rgba(190,18,60,0.8)) drop-shadow(0 0 120px rgba(190,18,60,0.4));
  }
  .glow-ring {
    position: absolute;
    width: 500px; height: 500px;
    border-radius: 50%;
    border: 1px solid rgba(190,18,60,0.15);
    box-shadow: 0 0 80px rgba(190,18,60,0.1);
  }
</style>
</head>
<body>
<div class="container">
  <div class="glow-ring"></div>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="560 455 155 170">
    <polygon fill="#BE123C" points="601.74 466.87 572.6 466.87 572.6 609.73 601.74 609.73 601.74 549.07 633.11 579.43 665.76 579.43 601.74 517.46 601.74 466.87"/>
    <polygon fill="#BE123C" points="672.72 466.87 672.72 528.12 644.63 500.93 611.98 500.93 672.72 559.72 672.72 609.73 701.86 609.73 701.86 466.87 672.72 466.87"/>
  </svg>
</div>
<script>
// Auto-export canvas after render
window.onload = () => {
  setTimeout(() => {
    const canvas = document.createElement('canvas');
    canvas.width = 1280; canvas.height = 720;
    const ctx = canvas.getContext('2d');
    // Draw dark bg
    const grad = ctx.createRadialGradient(640, 360, 0, 640, 360, 600);
    grad.addColorStop(0, '#1a0010');
    grad.addColorStop(1, '#000000');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 1280, 720);

    // Serialize SVG to image
    const svgEl = document.querySelector('svg');
    const svgData = new XMLSerializer().serializeToString(svgEl);
    const img = new Image();
    img.onload = () => {
      // Glow passes
      ctx.shadowColor = 'rgba(190,18,60,0.9)';
      ctx.shadowBlur = 80;
      ctx.drawImage(img, 430, 150, 420, 420);
      ctx.shadowBlur = 40;
      ctx.drawImage(img, 430, 150, 420, 420);
      ctx.shadowBlur = 0;
      ctx.drawImage(img, 430, 150, 420, 420);

      const link = document.createElement('a');
      link.download = 'futur-one-H-runway.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      document.body.innerHTML += '<p style="color:#22c55e;font-family:monospace;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);font-size:18px;">✓ futur-one-H-runway.png téléchargé !</p>';
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgData);
  }, 300);
};
</script>
</body>
</html>
